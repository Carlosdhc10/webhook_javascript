<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebHooks Tester</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin-top: 10px;
      padding: 10px;
      font-size: 14px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 14px;
    }
    button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>WebHooks Tester</h1>
  
  <label for="webhook-url">WebHook URL:</label>
  <input type="text" id="webhook-url" value="http://localhost:3000/webhook" />

  <button id="send-event-btn">Send Event</button>

  <label for="response-area">Server Response:</label>
  <textarea id="response-area" readonly></textarea>

  <script>
    const sendEventBtn = document.getElementById('send-event-btn');
    const responseArea = document.getElementById('response-area');
    const webhookUrl = document.getElementById('webhook-url').value;

    // Datos del evento que se enviarán al WebHook
    const eventData = {
      message: "Hello from WebHooks Frontend!",
      timestamp: new Date().toISOString()
    };

    sendEventBtn.addEventListener('click', async () => {
      try {
        // Realizar la solicitud POST al WebHook
        const response = await fetch(webhookUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(eventData),
        });

        // Verificar si la respuesta fue exitosa
        const responseData = await response.json();

        // Mostrar la respuesta en el área de texto
        responseArea.value = `
          --- Response Status ---
          ${response.status} ${response.statusText}
          
          --- Response Body ---
          ${JSON.stringify(responseData, null, 2)}
        `;
      } catch (error) {
        // En caso de error, mostrar el error en el área de texto
        responseArea.value = `Error: ${error.message}`;
      }
    });
  </script>

</body>
</html>
